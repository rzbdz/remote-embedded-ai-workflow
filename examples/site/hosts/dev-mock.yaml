# Local development host: mock GPIO backend, state under ../../../var (gitignored).
#   BSP_SITE=examples/site bsp-hostd -c examples/site/hosts/dev-mock.yaml
host:
  id: dev-mock
  description: Local development instance with the in-memory mock GPIO backend
server:
  bind: 127.0.0.1
  port: 8765
  state_dir: ../../../var/dev-mock
modules:
  gpio_relay:
    board: example-40pin
    backend: mock
    pinmux: false
    channels:
      P11: {mode: button, description: demo reset button}
      P13: {mode: relay, active_low: true, initial: "off"}
    aliases:
      DUT1/reset: P11
      DUT1/power: {target: P13, tags: [dut1, power], note: demo relay}
  sdk: {}
  dut:                       # lists duts/mock-board.yaml; no console or fastboot here
    probe: {pulse_ms: 200}
