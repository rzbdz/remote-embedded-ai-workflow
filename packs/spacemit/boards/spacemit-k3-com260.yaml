# Board profile: SpacemiT K3 Com260 carrier, 40-pin expansion header
#
#   pins:  <n>: {gpio: N, alt: "..."}    GPIO pin (label defaults to GPIO<N>)
#          <n>: {kind: power, label: 5V} power / gnd / nc / other
#   layout: dual-row (odd left, even right) | dual-row-split | single-row
id: spacemit-k3-com260
name: SpacemiT K3 Com260
description: K3 Com260 carrier, 40-pin expansion header. GPIO N = gpiochip(N/32) line N%32.

headers:
  - id: J40
    title: 40-pin expansion header
    layout: dual-row
    pin_count: 40
    pins:
      1:  {kind: power, label: 3.3V}
      2:  {kind: power, label: 5V}
      3:  {gpio: 83}
      4:  {kind: power, label: 5V}
      5:  {gpio: 82}
      6:  {kind: gnd, label: GND}
      7:  {gpio: 124}
      8:  {gpio: 121}
      9:  {kind: gnd, label: GND}
      10: {gpio: 120}
      11: {gpio: 118, alt: "R.GPIO[35]"}
      12: {gpio: 111, alt: "R.PWM8"}
      13: {gpio: 62}
      14: {kind: gnd, label: GND}
      15: {gpio: 126}
      16: {gpio: 71}
      17: {kind: power, label: 3.3V}
      18: {gpio: 63, alt: "R.GPIO[18]"}
      19: {gpio: 104}
      20: {kind: gnd, label: GND}
      21: {gpio: 105, alt: "R.I2C1 SCL"}
      22: {gpio: 61}
      23: {gpio: 106, alt: "R.I2C1 SDA"}
      24: {gpio: 107}
      25: {kind: gnd, label: GND}
      26: {gpio: 70}
      27: {gpio: 1}
      28: {gpio: 0}
      29: {gpio: 122, alt: "R.UART0 TXD"}
      30: {kind: gnd, label: GND}
      31: {gpio: 125}
      32: {gpio: 123, alt: "R.UART0 RXD"}
      33: {gpio: 127}
      34: {kind: gnd, label: GND}
      35: {gpio: 112, alt: "R.PWM9"}
      36: {gpio: 119}
      37: {gpio: 60}
      38: {gpio: 114, alt: "R.GPIO[31]"}
      39: {kind: gnd, label: GND}
      40: {gpio: 113, alt: "R.GPIO[30]"}

# Linux GPIO numbering hints (used by the chardev/gpiod backend).
gpio:
  numbering: global          # sysfs-global numbers; each bank is a 32-line chip
  bank_size: 32

# Pin-mux inspection via debugfs. ONLY pinmux-pins and gpio-ranges are read:
# reading pinconf-pins on this kernel oopses (spacemit_pinconf_dbg_show) and
# deadlocks pinctrl/GPIO requests until reboot.
pinctrl:
  debugfs: /sys/kernel/debug/pinctrl/d401e000.pinctrl
