name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[server,dev]'
      - name: Test
        run: python -m pytest -q
  client-py38:
    # the client must keep working from a clone on Python 3.8 (older build servers)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install pyyaml
      - name: CLI smoke test
        run: |
          BSP_SITE=examples/site bin/bsp sdk list
          BSP_SITE=examples/site bin/bsp sdk plan bsp-a --boot load
          bin/bsp --help
